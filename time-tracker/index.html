<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>time-tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app" data-tauri-drag-region>
      <header class="header" data-tauri-drag-region>
        <span class="date-label" id="today-date"></span>
        <div class="header-buttons">
          <button id="stats-btn" class="icon-btn" title="Stats">
            <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M3 13h2v8H3zm4-4h2v12H7zm4-6h2v18h-2zm4 8h2v10h-2zm4-3h2v13h-2z"/></svg>
          </button>
          <button id="close-btn" class="icon-btn icon-btn-close" title="Close">
            <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M18.3 5.71L12 12.01l-6.3-6.3-1.4 1.42L10.59 13.4l-6.3 6.3 1.41 1.41L12 14.83l6.3 6.3 1.41-1.41-6.3-6.3 6.3-6.3z"/></svg>
          </button>
        </div>
      </header>

      <div class="scroll-area">
        <!-- VIEW: Category list -->
        <section id="view-categories">
          <div class="today-summary">
            <div class="summary-top">
              <span class="summary-label">Today</span>
              <span class="summary-time" id="today-total">0m</span>
            </div>
            <div class="summary-bar">
              <div class="summary-bar-fill" id="today-bar"></div>
            </div>
          </div>
          <ul id="category-list" class="category-list"></ul>
          <button id="add-category-btn" class="add-category-btn">+ Add Category</button>
        </section>

        <!-- VIEW: Running timer (full takeover) -->
        <section id="view-timer" style="display:none">
          <div class="timer-display">
            <span class="timer-cat-dot" id="timer-cat-dot"></span>
            <span class="timer-cat-name" id="timer-category-name">Category</span>
            <span class="timer-time" id="timer-time">00:00:00</span>
            <button class="timer-stop-btn" id="timer-stop-btn">STOP</button>
          </div>
        </section>

        <!-- VIEW: Stats -->
        <section id="view-stats" style="display:none">
          <div class="stats-tabs">
            <button class="stats-tab active" data-period="today">Today</button>
            <button class="stats-tab" data-period="week">This Week</button>
            <button class="stats-tab" data-period="alltime">All Time</button>
          </div>
          <div class="chart-container">
            <canvas id="stats-chart"></canvas>
          </div>
          <div id="stats-breakdown" class="stats-breakdown"></div>
          <button id="stats-back-btn" class="stats-back-btn">Back</button>
        </section>

        <!-- MODAL: Add/Edit category -->
        <div id="modal-overlay" class="modal-overlay" style="display:none">
          <div class="modal">
            <h3 class="modal-title" id="modal-title">Add Category</h3>
            <input id="modal-input" class="modal-input" type="text" placeholder="Category name" maxlength="30" />
            <label class="modal-label" for="modal-goal">Daily goal (hours, optional)</label>
            <input id="modal-goal" class="modal-input" type="number" min="0" step="0.5" placeholder="e.g. 2" />
            <div class="color-picker" id="color-picker"></div>
            <div class="modal-buttons">
              <button id="modal-save" class="modal-btn modal-btn-save">Save</button>
              <button id="modal-cancel" class="modal-btn modal-btn-cancel">Cancel</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
